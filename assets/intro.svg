<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <style>
    .text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 24px; fill: #ffffff; }
    .highlight { fill: #ff006e; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate { animation: fadeIn 1s ease-out forwards; }
  </style>
  <rect width="100%" height="100%" fill="transparent"/>
  <text x="50%" y="50" text-anchor="middle" class="text animate">
    I transform visionary ideas into <tspan class="highlight">seamless</tspan> digital realities.
  </text>
</svg>
